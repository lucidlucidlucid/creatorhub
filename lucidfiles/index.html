<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="container">
      <section class="terminal" aria-label="Terminal">
        <div id="output" class="output" aria-live="polite" aria-atomic="false"></div>
        <div class="input-line">
          <span class="prompt">></span>
          <input id="command" type="text" autocomplete="off" spellcheck="false" aria-label="Command input" autofocus />
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
  </html>
