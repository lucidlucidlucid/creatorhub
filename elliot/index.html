<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@elliotvr</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

    <nav id="mainnav">
        <ul>
            <li><a href="#aboutme">About</a></li>
            <li><a href="#socials">Socials</a></li>
        </ul>
    </nav>

    <div id="container">
        <div id="hero" class="title">
            <div id="name">
                ELLIOT
            </div>
            <div id="subname" class="regular">
                @elliotVR
            </div>
        </div> 

        <div id="aboutme">
            <div class="subtitle" id="aboutmesub">
                ABOUT
            </div>
            <div class="normal" id="aboutmedesc">
                I am a VR content creator with ~2M+ followers overall.
            </div>
            <ul id="achieve">
                <li class="achieveitem">380,000+ on TikTok</li>
                <li class="achieveitem">1.2M+ on YouTube</li>
                <li class="achieveitem">200M+ views overall</li>
            </ul>

            
        </div>

        <div id="socials">
            <div class="subtitle" id="wtfm">
                WHERE TO FIND ME
            </div>
            <div id="links">
                <a href="https://www.youtube.com/@elliotVR" class="social-link">
                    <img src="images/youtube.png" alt="youtube">
                </a>
                <a href="https://www.tiktok.com/@elliotgt" class="social-link">
                    <img src="images/tiktok.png" alt="tiktok">
                </a>
                <a href="mailto:contact@elliotvr.com" class="social-link">
                    <img src="images/email.png" alt="email">
                </a>
                <a href="https://discord.gg/elliot" class="social-link">
                    <img src="images/discord.png" alt="discord">
                </a>
            </div>

            <div style="color: rgb(195, 195, 159); font-size: 20px;">
                


            </div>

            
    
    </div>
    <script src="elliot.js"></script>
</body>
</html>
